<div class="register-container">
  <h2>Create an Account</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <input type="text" formControlName="firstName" placeholder="First Name" required />
      <input type="text" formControlName="lastName" placeholder="Last Name" required />
    </div>

    <input type="text" formControlName="address" placeholder="Address" required />
    <input type="text" formControlName="phone" placeholder="Phone Number" required />
    <input type="email" formControlName="email" placeholder="Email" required email />
    <mat-form-field>
      <mat-label>Role</mat-label>
      <mat-select formControlName="role" required [disabled]="!roleControlEnabled">
        @for (role of roles; track role) {
        <mat-option [value]="role">{{role.name}}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <input type="text" formControlName="username" placeholder="Username" required />
    <input type="password" formControlName="password" placeholder="Password" required minlength="6" />
    <input type="password" formControlName="confirmPassword" placeholder="Confirm Password" required />

    <button type="submit">
      Register
    </button>
  </form>

  <p class="login-link">
    Already have an account?
    <a href="signin">Login here</a>
  </p>
</div>
