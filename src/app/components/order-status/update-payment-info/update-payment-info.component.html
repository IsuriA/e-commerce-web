<h1 mat-dialog-title>Update Payment Info</h1>
<div mat-dialog-content>
    <mat-form-field appearance="fill">
        <mat-label>Payment Reference</mat-label>
        <input matInput [(ngModel)]="data.reference" />
    </mat-form-field>

    <mat-form-field>
        <mat-label>Payment date</mat-label>
        <input matInput [matDatepicker]="datepicker" [(ngModel)]="data.paymentDate">
        <mat-datepicker #datepicker />
        <mat-datepicker-toggle [for]="datepicker" matSuffix />
    </mat-form-field>

    <!-- <mat-form-field>
        <mat-label>Payment time</mat-label>
        <input matInput [matTimepicker]="timepicker" [(ngModel)]="value" [ngModelOptions]="{updateOn: 'blur'}">
        <mat-timepicker #timepicker />
        <mat-timepicker-toggle [for]="timepicker" matSuffix />
    </mat-form-field> -->
</div>
<div mat-dialog-actions>
    <button mat-button (click)="onCancelClick()">No Thanks</button>
    <button mat-button [mat-dialog-close]="data.animal" cdkFocusInitial>Save</button>
</div>
