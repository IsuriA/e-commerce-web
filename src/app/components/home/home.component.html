<section class="hero">
  <div class="hero-content">
    <h1>Welcome to Tech Lanka</h1>
    <p>Your one-stop solution for all electrical needs</p>
    <button routerLink="/products">Shop Now</button>

    <div class="admin-links" *ngIf="user?.role?.accessLevel === 10">
      <a routerLink="/supplier-management">Supplier Management</a>
      <a routerLink="/debtors-followup">Debtors Followup Module</a>
    </div>
  </div>

  <!-- Image Slider -->
  <div class="slider">
    <div class="slides">
      <img src="assets/images/category1.jpg" alt="Electrical Tools" />
      <img src="assets/images/category2.jpg" alt="Lighting Solutions" />
      <img src="assets/images/category3.jpg" alt="Wiring Accessories" />
    </div>
  </div>
</section>
