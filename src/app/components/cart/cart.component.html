<section class="cart-container">
  <h2>Your Shopping Cart</h2>

  <div *ngIf="(order$ | async)?.items.length > 0; else emptyCart">
    <div class="cart-item" *ngFor="let item of (order$ | async)?.items">
      <img src="{{ configService.getServerAssetsUrl() }}/{{ item.product.imageUrl }}" alt="{{ item.product.name }}" />

      <div class="cart-info">
        <h4>{{ item.product.name }}</h4>
        <p>LKR {{ item.product.price }}</p>

        <div class="quantity-controls">
          <button (click)="decreaseQuantity(item)">−</button>
          <span>{{ item.quantity }}</span>
          <button (click)="increaseQuantity(item)">+</button>
        </div>

        <button class="remove" (click)="false">Remove</button>
      </div>
    </div>

    <div class="cart-summary">
      <!-- <h3>Total: LKR {{ getTotal() }}</h3> -->
      <a href="checkout">Proceed to Checkout</a>
      <button class="checkout-btn">Proceed to Checkout</button>
    </div>
  </div>

  <ng-template #emptyCart>
    <p>Your cart is currently empty.</p>
  </ng-template>
</section>
